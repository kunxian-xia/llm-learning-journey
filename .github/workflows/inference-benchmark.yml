name: Inference benchmark

on:
  pull_request:
    paths:
      - "inference-serving-runtime/**"
      - ".github/workflows/inference-benchmark.yml"
  push:
    branches: [master]
    paths:
      - "inference-serving-runtime/**"
      - ".github/workflows/inference-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

# Serialize measurements on the single GPU runner.
concurrency:
  group: inference-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    # The self-hosted GPU runner must never execute code from a fork PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 60
    outputs:
      result_ready: ${{ steps.run.outcome }}
    env:
      UV_CACHE_DIR: /home/runner/_work/_uv_cache
      HF_HOME: /home/runner/_work/_hf_cache
      MODEL_REVISION: 060db6499f32faf8b98477b0a26969ef7d8b9987
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

    steps:
      - name: Check out head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out base for paired comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Install locked dependencies
        working-directory: inference-serving-runtime
        run: uv sync --frozen --extra test

      - name: Run Qwen2.5 benchmark
        id: run
        working-directory: inference-serving-runtime
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          args=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            args+=(--base-source "$GITHUB_WORKSPACE/base/inference-serving-runtime/src/inference_serving_runtime/adapters/qwen25.py")
          fi
          uv run --frozen --no-sync python benchmarks/compare_revisions.py \
            --output-dir "$RUNNER_TEMP/inference-benchmark" \
            --revision "$MODEL_REVISION" \
            --head-sha "$HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            "${args[@]}"
          cat "$RUNNER_TEMP/inference-benchmark/comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark result
        if: steps.run.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: qwen25-benchmark
          path: ${{ runner.temp }}/inference-benchmark/
          retention-days: 90

      - name: Reject performance regression
        if: steps.run.outcome == 'success' && github.event_name == 'pull_request'
        working-directory: inference-serving-runtime
        run: |
          uv run --frozen --no-sync python - "$RUNNER_TEMP/inference-benchmark/result.json" <<'PY'
          import json
          import sys

          result = json.load(open(sys.argv[1]))
          if result["failed"]:
              raise SystemExit("Qwen2.5 prefill or decode exceeded the regression threshold")
          PY

  comment:
    name: Comment on PR
    needs: benchmark
    if: always() && github.event_name == 'pull_request' && needs.benchmark.outputs.result_ready == 'success' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qwen25-benchmark
          path: result

      - name: Upsert benchmark comment
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('result/comment.md', 'utf8');
            const marker = '<!-- inference-serving-benchmark -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
